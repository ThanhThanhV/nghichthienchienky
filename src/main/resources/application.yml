spring:
  application:
    name: nghich-thien-chien-ky

  thymeleaf:
    cache: false

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nghich_thien_chien_ky?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true



server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    vn.nghichtien.chienky: INFO
