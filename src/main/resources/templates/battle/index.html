<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nghịch Thiên Chiến Ký - Battle</title>

    <link rel="stylesheet"
          th:href="@{/css/battle/battle.css}">
</head>

<body>

<div class="battle-page">

    <!-- HEADER -->
    <header class="battle-header">
        <div class="battle-title">
            <h1>NGHỊCH THIÊN CHIẾN KÝ</h1>
            <span>CHIẾN ĐẤU</span>
        </div>

        <div class="battle-information">
            <div class="info-item">
                <span class="info-label">VÒNG</span>
                <strong id="battle-round">0</strong>
            </div>

            <div class="info-item">
                <span class="info-label">TRẠNG THÁI</span>
                <strong id="battle-status">CHỜ TRẬN ĐẤU</strong>
            </div>
        </div>
    </header>

    <!-- BATTLE CONTROLS -->
    <section class="battle-controls">
        <div class="battle-control-left">
            <span class="control-label">TỐC ĐỘ</span>

            <button id="speed-button"
                    class="control-button"
                    type="button">
                x1
            </button>

            <button id="auto-button"
                    class="control-button"
                    type="button">
                AUTO: OFF
            </button>
        </div>

        <div class="battle-control-right">
            <button id="start-button"
                    class="control-button primary-button"
                    type="button">
                BẮT ĐẦU
            </button>
        </div>
    </section>

    <!-- TURN ORDER -->
    <section class="turn-order-section">
        <h2>THỨ TỰ HÀNH ĐỘNG</h2>

        <div id="turn-order"
             class="turn-order-list">
            <span class="empty-message">
                Chưa có dữ liệu lượt đánh
            </span>
        </div>
    </section>

    <!-- BATTLE FIELD -->
    <main class="battle-field">

        <!-- PLAYER TEAM -->
        <section class="battle-team player-team">

            <div class="team-heading">
                <h2>ĐỘI HÌNH CỦA BẠN</h2>
                <span class="team-side">PLAYER</span>
            </div>

            <div id="player-formation"
                 class="team-formation">

                <!-- 9 ô vị trí được JavaScript tạo -->
            </div>

        </section>

        <!-- VS -->
        <div class="battle-vs">
            VS
        </div>

        <!-- ENEMY TEAM -->
        <section class="battle-team enemy-team">

            <div class="team-heading">
                <h2>ĐỘI HÌNH ĐỐI THỦ</h2>
                <span class="team-side">ENEMY</span>
            </div>

            <div id="enemy-formation"
                 class="team-formation">

                <!-- 9 ô vị trí được JavaScript tạo -->
            </div>

        </section>

    </main>

    <!-- BATTLE LOG -->
    <section class="battle-log-section">

        <div class="section-heading">
            <h2>NHẬT KÝ CHIẾN ĐẤU</h2>

            <button id="clear-log-button"
                    class="small-button"
                    type="button">
                XÓA NHẬT KÝ
            </button>
        </div>

        <div id="battle-log"
             class="battle-log">

            <div class="empty-message">
                Nhật ký chiến đấu sẽ xuất hiện tại đây.
            </div>

        </div>

    </section>

    <!-- FOOTER -->
    <footer class="battle-footer">
        NGHỊCH THIÊN CHIẾN KÝ
    </footer>

</div>

<script th:src="@{/js/battle/battle.js}"></script>

</body>
</html>
