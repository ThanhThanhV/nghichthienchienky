<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Nghịch Thiên Chiến Ký</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #080d19;
            color: #f8fafc;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 600px;
            padding: 35px;
            text-align: center;
            border: 1px solid #334155;
            border-radius: 14px;
            background: #111827;
        }

        h1 { color: #fbbf24; }

        .button {
            display: inline-block;
            margin: 10px;
            padding: 12px 22px;
            color: #111827;
            border-radius: 7px;
            background: #fbbf24;
            text-decoration: none;
            font-weight: bold;
        }

        button {
            padding: 12px 22px;
            color: white;
            border: 1px solid #475569;
            border-radius: 7px;
            background: #334155;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>NGHỊCH THIÊN CHIẾN KÝ</h1>

    <p>
        Xin chào,
        <strong th:text="${username}"></strong>
    </p>

    <p>Đăng nhập thành công!</p>

    <a class="button" th:href="@{/battle}">
        VÀO CHIẾN ĐẤU
    </a>

    <form th:action="@{/logout}" method="post">
        <button type="submit">ĐĂNG XUẤT</button>
    </form>

</div>

</body>
</html>
