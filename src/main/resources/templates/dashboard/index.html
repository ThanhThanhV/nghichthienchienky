<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080d19">
    <title>Dashboard - Nghịch Thiên Chiến Ký</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            padding: 24px; color: #f8fafc; background:
                radial-gradient(circle at 18% 12%, rgba(84,105,158,.22), transparent 32%),
                radial-gradient(circle at 85% 90%, rgba(149,93,47,.16), transparent 35%),
                #080d19; font-family: Arial, sans-serif;
        }
        .container {
            width: min(100%, 660px); padding: clamp(26px,5vw,48px);
            text-align: center; border: 1px solid rgba(212,181,119,.28);
            border-radius: 18px; background: rgba(17,24,39,.92);
            box-shadow: 0 24px 80px rgba(0,0,0,.38);
        }
        .eyebrow { color: #a9b5cc; font-size: 10px; letter-spacing: .28em; }
        h1 { margin: 12px 0; color: #f4d58f; font: 700 clamp(24px,5vw,38px) Georgia,serif; }
        .welcome { color: #b8c1d2; line-height: 1.7; }
        .welcome strong { color: #fff0c9; }
        .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin: 28px 0; }
        .button {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 190px; padding: 13px 20px; color: #20190d;
            border: 1px solid #d9b76e; border-radius: 8px;
            background: linear-gradient(135deg,#f4dfa9,#bd914e);
            text-decoration: none; font-size: 12px; font-weight: 800; letter-spacing: .08em;
        }
        .button.secondary { color: #e7dfd0; border-color: #48536a; background: #202a3d; }
        .logout-button {
            padding: 10px 18px; color: #aeb8c9; border: 1px solid #465168;
            border-radius: 7px; background: transparent; cursor: pointer;
        }
    </style>
</head>
<body>
<main class="container">
    <div class="eyebrow">TU TIÊN · CHIẾN THUẬT · ĐỊNH MỆNH</div>
    <h1>NGHỊCH THIÊN CHIẾN KÝ</h1>
    <p class="welcome">
        Xin chào, <strong th:text="${username}">Tu sĩ</strong>.<br>
        Hành trình nghịch thiên của ngươi bắt đầu từ đây.
    </p>
    <nav class="actions" aria-label="Điều hướng game">
        <a class="button" th:href="@{/formation}">⚔ XẾP ĐỘI HÌNH</a>
        <a class="button secondary" th:href="@{/battle}">VÀO CHIẾN ĐẤU</a>
    </nav>
    <form th:action="@{/logout}" method="post">
        <button class="logout-button" type="submit">ĐĂNG XUẤT</button>
    </form>
</main>
</body>
</html>
