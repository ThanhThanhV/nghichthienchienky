<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Nghịch Thiên Chiến Ký</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #080d19;
            color: #f8fafc;
            font-family: Arial, sans-serif;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            border: 1px solid #334155;
            border-radius: 14px;
            background: #111827;
        }

        h1 {
            color: #fbbf24;
            text-align: center;
            font-size: 22px;
        }

        .subtitle {
            margin-bottom: 28px;
            color: #94a3b8;
            text-align: center;
        }

        label {
            display: block;
            margin: 15px 0 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            color: white;
            border: 1px solid #475569;
            border-radius: 7px;
            background: #1e293b;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            color: #111827;
            border: 0;
            border-radius: 7px;
            background: #fbbf24;
            font-weight: bold;
            cursor: pointer;
        }

        .message {
            margin: 12px 0;
            color: #f87171;
            text-align: center;
        }

        .success {
            color: #4ade80;
        }

        .bottom {
            margin-top: 20px;
            color: #94a3b8;
            text-align: center;
        }

        a { color: #fbbf24; }
    
        @media (max-width: 600px) {
            body { min-height: 100dvh; padding: 14px; align-items: flex-start; }
            .auth-card { max-width: 100%; margin: auto 0; padding: 22px 17px; border-radius: 12px; }
            h1 { font-size: 20px; line-height: 1.3; }
            .subtitle { font-size: 12px; line-height: 1.5; margin-bottom: 20px; }
            input, button { min-height: 44px; font-size: 14px; }
            label { font-size: 12px; }
        }
</style>
</head>

<body>

<div class="auth-card">

    <h1>NGHỊCH THIÊN CHIẾN KÝ</h1>
    <div class="subtitle">ĐĂNG NHẬP TÀI KHOẢN</div>

    <div class="message"
         th:if="${param.error}">
        Username hoặc mật khẩu không chính xác.
    </div>

    <div class="message success"
         th:if="${successMessage}"
         th:text="${successMessage}">
    </div>

    <div class="message success"
         th:if="${param.logout}">
        Đã đăng xuất thành công.
    </div>

    <form th:action="@{/login}" method="post">

        <label>Username</label>
        <input type="text"
               name="username"
               required
               autofocus>

        <label>Mật khẩu</label>
        <input type="password"
               name="password"
               required>

        <button type="submit">ĐĂNG NHẬP</button>

    </form>

    <div class="bottom">
        Chưa có tài khoản?
        <a th:href="@{/register}">Đăng ký ngay</a>
    </div>

</div>

</body>
</html>
