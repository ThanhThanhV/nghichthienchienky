<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Nghịch Thiên Chiến Ký</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #080d19;
            color: #f8fafc;
            font-family: Arial, sans-serif;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            padding: 30px;
            border: 1px solid #334155;
            border-radius: 14px;
            background: #111827;
        }

        h1 {
            color: #fbbf24;
            text-align: center;
            font-size: 22px;
        }

        .subtitle {
            margin-bottom: 25px;
            color: #94a3b8;
            text-align: center;
        }

        label {
            display: block;
            margin: 14px 0 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            color: white;
            border: 1px solid #475569;
            border-radius: 7px;
            background: #1e293b;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            color: #111827;
            border: 0;
            border-radius: 7px;
            background: #fbbf24;
            font-weight: bold;
            cursor: pointer;
        }

        .message {
            margin-top: 7px;
            color: #f87171;
            font-size: 12px;
        }

        .error-box {
            margin: 12px 0;
            color: #f87171;
            text-align: center;
        }

        .bottom {
            margin-top: 20px;
            color: #94a3b8;
            text-align: center;
        }

        a { color: #fbbf24; }
    </style>
</head>

<body>

<div class="auth-card">

    <h1>NGHỊCH THIÊN CHIẾN KÝ</h1>
    <div class="subtitle">TẠO TÀI KHOẢN MỚI</div>

    <div class="error-box"
         th:if="${errorMessage}"
         th:text="${errorMessage}">
    </div>

    <form th:action="@{/register}"
          th:object="${registerRequest}"
          method="post">

        <label>Username</label>
        <input type="text"
               th:field="*{username}"
               minlength="4"
               maxlength="50"
               required>

        <div class="message"
             th:if="${#fields.hasErrors('username')}"
             th:errors="*{username}">
        </div>

        <label>Email</label>
        <input type="email"
               th:field="*{email}"
               maxlength="150"
               required>

        <div class="message"
             th:if="${#fields.hasErrors('email')}"
             th:errors="*{email}">
        </div>

        <label>Mật khẩu</label>
        <input type="password"
               th:field="*{password}"
               minlength="8"
               maxlength="72"
               required>

        <div class="message"
             th:if="${#fields.hasErrors('password')}"
             th:errors="*{password}">
        </div>

        <label>Xác nhận mật khẩu</label>
        <input type="password"
               th:field="*{confirmPassword}"
               required>

        <div class="message"
             th:if="${#fields.hasErrors('confirmPassword')}"
             th:errors="*{confirmPassword}">
        </div>

        <button type="submit">ĐĂNG KÝ</button>

    </form>

    <div class="bottom">
        Đã có tài khoản?
        <a th:href="@{/login}">Đăng nhập</a>
    </div>

</div>

</body>
</html>
